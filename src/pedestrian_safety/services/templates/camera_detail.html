<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Камера {{ camera_id }}</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121c2e;
      --text: #e2e8f0;
      --muted: #8ca0b8;
      --line: rgba(148, 163, 184, 0.18);
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #08101c 0%, #101a2d 100%);
    }
    .layout { display: grid; grid-template-columns: 380px 1fr; min-height: 100vh; }
    .sidebar {
      border-right: 1px solid var(--line);
      background: rgba(8, 16, 28, 0.92);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: auto;
    }
    h1 { margin: 0; font-size: 28px; }
    p { margin: 0; color: var(--muted); line-height: 1.45; }
    .card {
      background: rgba(18, 28, 46, 0.94);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      display: grid;
      gap: 8px;
    }
    label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    input, select, button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 10px 12px;
      font: inherit;
    }
    input, select { background: #0c1525; color: var(--text); }
    button {
      cursor: pointer;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: white;
      border: none;
      font-weight: 600;
    }
    button.secondary { background: linear-gradient(135deg, #475569, #64748b); }
    button.danger { background: linear-gradient(135deg, #b91c1c, #ef4444); }
    .viewer {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .frame-shell {
      position: relative;
      width: 100%;
      height: calc(100vh - 36px);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #020617;
    }
    #frameImage, #overlayCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #frameImage { object-fit: contain; background: #020617; }
    #overlayCanvas.active { cursor: crosshair; }
    .zone-list { display: grid; gap: 8px; max-height: 36vh; overflow: auto; }
    .zone-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background: rgba(2, 6, 23, 0.35);
    }
    .zone-item strong { display: block; margin-bottom: 4px; }
    .zone-item span { display: block; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .status { min-height: 20px; color: var(--muted); font-size: 13px; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .frame-shell { height: 58vh; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div>
        <h1>{{ camera_id }}</h1>
        <p>Здесь берётся первый кадр первого видео камеры и поверх него хранится разметка зон для `zones.json`.</p>
      </div>

      <div class="card">
        <label for="zoneType">Тип зоны</label>
        <select id="zoneType">
          <option value="road">Дорога</option>
          <option value="crosswalk">Переход</option>
        </select>
        <label for="zoneLabel">Название</label>
        <input id="zoneLabel" placeholder="Например, Переход 1">
        <button id="startDrawBtn">Начать рисовать полигон</button>
        <button id="finishDrawBtn" class="secondary">Завершить текущий полигон</button>
        <button id="saveBtn">Сохранить зоны</button>
        <button id="backBtn" class="secondary">Назад к карте</button>
        <div class="hint">Клик добавляет точку. `Enter` или кнопка завершает полигон. `Escape` отменяет текущий черновик.</div>
        <div class="status" id="status"></div>
      </div>

      <div class="card">
        <label>Сохранённые зоны</label>
        <div class="zone-list" id="zoneList"></div>
      </div>
    </aside>

    <main class="viewer">
      <div class="frame-shell">
        <img id="frameImage" alt="Первый кадр камеры">
        <canvas id="overlayCanvas"></canvas>
      </div>
    </main>
  </div>

  <script>
    const CAMERA_ID = "{{ camera_id }}";
    const state = {
      zones: [],
      draft: [],
      drawing: false,
      imageBox: { x: 0, y: 0, width: 1, height: 1 },
    };

    const els = {
      backBtn: document.getElementById('backBtn'),
      finishDrawBtn: document.getElementById('finishDrawBtn'),
      frameImage: document.getElementById('frameImage'),
      overlayCanvas: document.getElementById('overlayCanvas'),
      saveBtn: document.getElementById('saveBtn'),
      startDrawBtn: document.getElementById('startDrawBtn'),
      status: document.getElementById('status'),
      zoneLabel: document.getElementById('zoneLabel'),
      zoneList: document.getElementById('zoneList'),
      zoneType: document.getElementById('zoneType'),
    };

    function setStatus(text) { els.status.textContent = text || ''; }
    function zoneColor(zoneType) { return zoneType === 'crosswalk' ? [220, 160, 0] : [0, 80, 220]; }

    function resizeCanvas() {
      const rect = els.overlayCanvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      els.overlayCanvas.width = Math.round(rect.width * ratio);
      els.overlayCanvas.height = Math.round(rect.height * ratio);
      const ctx = els.overlayCanvas.getContext('2d');
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      computeImageBox();
      renderCanvas();
    }

    function computeImageBox() {
      const shellRect = els.overlayCanvas.getBoundingClientRect();
      const naturalWidth = els.frameImage.naturalWidth || shellRect.width;
      const naturalHeight = els.frameImage.naturalHeight || shellRect.height;
      const scale = Math.min(shellRect.width / naturalWidth, shellRect.height / naturalHeight);
      const width = naturalWidth * scale;
      const height = naturalHeight * scale;
      state.imageBox = {
        x: (shellRect.width - width) / 2,
        y: (shellRect.height - height) / 2,
        width,
        height,
      };
    }

    function toCanvasPoint(point) {
      return [
        state.imageBox.x + point[0] * state.imageBox.width,
        state.imageBox.y + point[1] * state.imageBox.height,
      ];
    }

    function fromCanvasPoint(offsetX, offsetY) {
      const x = (offsetX - state.imageBox.x) / state.imageBox.width;
      const y = (offsetY - state.imageBox.y) / state.imageBox.height;
      if (x < 0 || x > 1 || y < 0 || y > 1) return null;
      return [x, y];
    }

    function drawPolygon(ctx, polygon, color, fillAlpha) {
      if (!polygon.length) return;
      ctx.beginPath();
      polygon.forEach((point, index) => {
        const [x, y] = toCanvasPoint(point);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fillStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${fillAlpha})`;
      ctx.strokeStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
    }

    function renderCanvas() {
      const ctx = els.overlayCanvas.getContext('2d');
      const rect = els.overlayCanvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      state.zones.forEach(zone => drawPolygon(ctx, zone.polygon, zone.color || zoneColor(zone.type), 0.18));
      if (state.draft.length) {
        drawPolygon(ctx, state.draft, zoneColor(els.zoneType.value), 0.10);
        state.draft.forEach(point => {
          const [x, y] = toCanvasPoint(point);
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        });
      }
    }

    function renderZoneList() {
      els.zoneList.innerHTML = '';
      if (!state.zones.length) {
        els.zoneList.innerHTML = '<div class="hint">Зон пока нет.</div>';
        return;
      }

      state.zones.forEach(zone => {
        const item = document.createElement('div');
        item.className = 'zone-item';
        item.innerHTML = `<strong>${zone.label}</strong><span>${zone.type} • точек: ${zone.polygon.length}</span>`;
        const btn = document.createElement('button');
        btn.className = 'danger';
        btn.textContent = 'Удалить';
        btn.addEventListener('click', () => {
          state.zones = state.zones.filter(item => item.id !== zone.id);
          renderZoneList();
          renderCanvas();
        });
        item.appendChild(btn);
        els.zoneList.appendChild(item);
      });
    }

    function startDrawing() {
      state.drawing = true;
      state.draft = [];
      els.overlayCanvas.classList.add('active');
      setStatus('Режим рисования включён');
      renderCanvas();
    }

    function cancelDrawing() {
      state.drawing = false;
      state.draft = [];
      els.overlayCanvas.classList.remove('active');
      renderCanvas();
    }

    function finishDrawing() {
      if (state.draft.length < 3) {
        setStatus('Нужно минимум 3 точки');
        return;
      }
      const zoneType = els.zoneType.value;
      const label = (els.zoneLabel.value || '').trim() || `Зона ${state.zones.length + 1}`;
      state.zones.push({
        id: `${CAMERA_ID}_${Date.now()}`,
        label,
        polygon: state.draft.slice(),
        type: zoneType,
        color: zoneColor(zoneType),
        traffic_light_roi: null,
        has_light: false,
        light_type: 'pedestrian',
      });
      cancelDrawing();
      renderZoneList();
      setStatus(`Добавлена зона "${label}"`);
    }

    async function saveZones() {
      setStatus('Сохранение зон...');
      const response = await fetch(`/api/camera/${encodeURIComponent(CAMERA_ID)}/zones`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ zones: state.zones }),
      });
      const payload = await response.json();
      if (!payload.ok) throw new Error(payload.error || 'Не удалось сохранить зоны');
      setStatus(`Сохранено зон: ${payload.zones_count}`);
    }

    async function loadCamera() {
      const response = await fetch(`/api/camera/${encodeURIComponent(CAMERA_ID)}`);
      const payload = await response.json();
      state.zones = payload.zones || [];
      if (!payload.has_frame) {
        setStatus('Для камеры не найдено видео');
        els.frameImage.removeAttribute('src');
      } else {
        els.frameImage.src = payload.frame_url;
      }
      renderZoneList();
    }

    els.frameImage.addEventListener('load', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);
    els.overlayCanvas.addEventListener('click', event => {
      if (!state.drawing) return;
      const point = fromCanvasPoint(event.offsetX, event.offsetY);
      if (!point) return;
      state.draft.push(point);
      renderCanvas();
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Enter' && state.drawing) finishDrawing();
      if (event.key === 'Escape' && state.drawing) {
        cancelDrawing();
        setStatus('Черновик отменён');
      }
    });

    els.startDrawBtn.addEventListener('click', startDrawing);
    els.finishDrawBtn.addEventListener('click', finishDrawing);
    els.saveBtn.addEventListener('click', () => saveZones().catch(error => setStatus(error.message)));
    els.backBtn.addEventListener('click', () => { window.location.href = '/'; });

    loadCamera()
      .then(() => resizeCanvas())
      .catch(error => setStatus(error.message));
  </script>
</body>
</html>
