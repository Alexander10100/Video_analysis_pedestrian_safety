name: CI - Lint, Tests & Docker Hub

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks (ruff, mypy, poetry-check, ...)
        env:
          # в CI проверяем код, а не ветку — запрет коммитов в main_branch тут не нужен
          SKIP: no-commit-to-branch
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install "poetry>=2.5"

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies (from poetry.lock)
        run: poetry install --no-interaction

      - name: Type check (mypy)
        run: poetry run mypy

      - name: Run tests with coverage
        run: poetry run pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main_branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_SHA="sha-${GITHUB_SHA::12}"
          docker buildx build \
            --push \
            --target stream_detect \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "${DOCKERHUB_USERNAME}/video-analysis-pedestrian-safety-stream-detect:latest" \
            --tag "${DOCKERHUB_USERNAME}/video-analysis-pedestrian-safety-stream-detect:${IMAGE_SHA}" \
            .

          docker buildx build \
            --push \
            --target heatmap \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "${DOCKERHUB_USERNAME}/video-analysis-pedestrian-safety-heatmap:latest" \
            --tag "${DOCKERHUB_USERNAME}/video-analysis-pedestrian-safety-heatmap:${IMAGE_SHA}" \
            .

          docker buildx build \
            --push \
            --target camera_map \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "${DOCKERHUB_USERNAME}/video-analysis-pedestrian-safety-camera-map:latest" \
            --tag "${DOCKERHUB_USERNAME}/video-analysis-pedestrian-safety-camera-map:${IMAGE_SHA}" \
            .
