name: CI - Tests, Linter & Docker Hub

on:
  push:
    branches:
      - '**' 
  pull_request:
    branches:
      - '**'  
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov
      
      - name: Lint with Ruff (PEP8)
        run: ruff check . --output-format=github
      
      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=. --cov-report=term

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_SHA="sha-${GITHUB_SHA::12}"
          docker buildx build \
            --push \
            --target stream_detect \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "${DOCKERHUB_USERNAME}/video-analysis-pedestrian-safety-stream-detect:latest" \
            --tag "${DOCKERHUB_USERNAME}/video-analysis-pedestrian-safety-stream-detect:${IMAGE_SHA}" \
            .

          docker buildx build \
            --push \
            --target heatmap \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "${DOCKERHUB_USERNAME}/video-analysis-pedestrian-safety-heatmap:latest" \
            --tag "${DOCKERHUB_USERNAME}/video-analysis-pedestrian-safety-heatmap:${IMAGE_SHA}" \
            .

          docker buildx build \
            --push \
            --target camera_map \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "${DOCKERHUB_USERNAME}/video-analysis-pedestrian-safety-camera-map:latest" \
            --tag "${DOCKERHUB_USERNAME}/video-analysis-pedestrian-safety-camera-map:${IMAGE_SHA}" \
            .
